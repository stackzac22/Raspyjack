# /etc/raspyjack/kismet_mqtt.conf on opi (raspyjack-opi)
# Same broker/topic as jack so HA sees opi's alerts identically; distinct
# NODE_NAME + client id so both can coexist without MQTT id clashes.
KISMET_HOST=localhost
KISMET_PORT=2501
KISMET_USER=admin
KISMET_PASS=raspyjack
MQTT_HOST=100.127.43.75
MQTT_PORT=1883
MQTT_TLS=false
MQTT_USER=netsurvey
MQTT_PASS=039b3860703ff5408b75e088
MQTT_CLIENT_ID=kismet-bridge-opi
MQTT_TOPIC=kismet/alerts/wifi
NODE_NAME=opi
POLL_SECONDS=5
NEW_DEVICE_ALERTS=false
NEW_DEVICE_MIN_SIGNAL=-95
