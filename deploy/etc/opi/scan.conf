# /etc/raspyjack/scan.conf on opi (raspyjack-opi)
# Onboard Wi-Fi (wlan0) stays the uplink; the USB Realtek 8821cu (BrosTrend)
# dongle enumerates under its MAC-predictable name = capture iface.
# If you swap the dongle, update this + the source= line in kismet_site.conf.
SCAN_IFACE=wlxc8fe0fcd700f
KISMET_SERVICE=kismet
# Bridge publishes opi's Kismet alerts to HA; watchdog auto-recovers the rtw88
# DFS wedge. Both start/stop with kismet so they only run while opi scans.
EXTRA_SERVICES="kismet-mqtt-bridge raspyjack-kismet-watchdog"
