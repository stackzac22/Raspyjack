# /config/packages/scan_control.yaml  (Home Assistant, Pi 4)
#
# Voice + dashboard control of the RaspyJack Wi-Fi capture stack.
#
#   Pyramid voice / dashboard toggle
#        |  (HA switch)
#        v
#   raspyjack/<node>/scan/set   -->  rj-scan-agent on the node  -->  rj-scan on|off
#        ^                                                              |
#        +--- raspyjack/<node>/scan/state (retained) <------------------+
#             raspyjack/<node>/scan/avail (LWT)  = switch availability
#
# Deploy: copy to /config/packages/scan_control.yaml, `ha core check`,
#         then `ha core restart` (packages need a full restart, not reload).
#
# Broker account = the shared 'netsurvey' Mosquitto user (same as the other
# RaspyJack bridges). Confirmation is spoken back through the Assist pipeline,
# which plays on the Atom/Pyramid satellite the user is talking to.

mqtt:
  switch:
    - name: "Jack Wi-Fi scan"
      unique_id: raspyjack_jack_wifi_scan
      icon: mdi:radar
      command_topic: "raspyjack/jack/scan/set"
      payload_on: "on"
      payload_off: "off"
      state_topic: "raspyjack/jack/scan/state"
      state_on: "on"
      state_off: "off"
      availability_topic: "raspyjack/jack/scan/avail"
      payload_available: "online"
      payload_not_available: "offline"
      optimistic: false
      qos: 1
      retain: false

    - name: "Opi Wi-Fi scan"
      unique_id: raspyjack_opi_wifi_scan
      icon: mdi:radar
      command_topic: "raspyjack/opi/scan/set"
      payload_on: "on"
      payload_off: "off"
      state_topic: "raspyjack/opi/scan/state"
      state_on: "on"
      state_off: "off"
      availability_topic: "raspyjack/opi/scan/avail"
      payload_available: "online"
      payload_not_available: "offline"
      optimistic: false
      qos: 1
      retain: false

automation:
  # ---- jack: stop -----------------------------------------------------------
  - id: rj_scan_stop_jack
    alias: "RJ scan — stop on jack (voice)"
    mode: single
    trigger:
      - platform: conversation
        command:
          - "stop scanning on jack"
          - "stop [the] (wifi|wi-fi|kismet) scanning on jack"
          - "stop kismet on jack"
          - "jack stop scanning"
          - "kill scanning on jack"
          - "turn off scanning on jack"
          - "[turn] [the] [kismet] scan off (on|for) jack"
          - "[turn] kismet off (on|for) jack"
          - "scanning off (on|for) jack"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.jack_wi_fi_scan
      - set_conversation_response: "Stopping Wi-Fi scanning on jack. He's safe to use now."

  # ---- jack: start ----------------------------------------------------------
  - id: rj_scan_start_jack
    alias: "RJ scan — start on jack (voice)"
    mode: single
    trigger:
      - platform: conversation
        command:
          - "start scanning on jack"
          - "start [the] (wifi|wi-fi|kismet) scanning on jack"
          - "start kismet on jack"
          - "resume scanning on jack"
          - "jack start scanning"
          - "turn on scanning on jack"
          - "[turn] [the] [kismet] scan on (on|for) jack"
          - "[turn] kismet on (on|for) jack"
          - "scanning on (on|for) jack"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.jack_wi_fi_scan
      - set_conversation_response: "Starting Wi-Fi scanning on jack."

  # ---- opi: start (standalone, does NOT touch jack) --------------------------
  - id: rj_scan_start_opi
    alias: "RJ scan — start on opi (voice)"
    mode: single
    trigger:
      - platform: conversation
        command:
          - "start scanning on opi"
          - "start [the] (wifi|wi-fi|kismet) scanning on opi"
          - "start kismet on opi"
          - "resume scanning on opi"
          - "opi start scanning"
          - "start opi scanning"
          - "turn on scanning on opi"
          - "[turn] [the] [kismet] scan on (on|for) opi"
          - "[turn] kismet on (on|for) opi"
          - "scanning on (on|for) opi"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.opi_wi_fi_scan
      - set_conversation_response: "Starting Wi-Fi scanning on opi."

  # ---- opi: stop (standalone, does NOT touch jack) ---------------------------
  - id: rj_scan_stop_opi
    alias: "RJ scan — stop on opi (voice)"
    mode: single
    trigger:
      - platform: conversation
        command:
          - "stop scanning on opi"
          - "stop [the] (wifi|wi-fi|kismet) scanning on opi"
          - "stop kismet on opi"
          - "opi stop scanning"
          - "stop opi scanning"
          - "kill scanning on opi"
          - "turn off scanning on opi"
          - "[turn] [the] [kismet] scan off (on|for) opi"
          - "[turn] kismet off (on|for) opi"
          - "scanning off (on|for) opi"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.opi_wi_fi_scan
      - set_conversation_response: "Stopping Wi-Fi scanning on opi."

  # ---- handoff: jack -> opi --------------------------------------------------
  - id: rj_scan_handoff_to_opi
    alias: "RJ scan — hand off to opi (voice)"
    mode: single
    trigger:
      - platform: conversation
        command:
          - "hand [off] scanning to opi"
          - "have opi take over [the] scanning"
          - "switch scanning to opi"
          - "move scanning to opi"
          - "let opi take over scanning"
          # "from jack to opi" phrasings (+ Whisper opi mis-spellings)
          - "switch [the] [(wifi|wi-fi|wi fi)] [scanning] from jack to (opi|op|o pi|o p i|o o p|oh pi|opie)"
          - "(move|hand|give|send) [the] [scanning] from jack to (opi|op|o pi|o p i|o o p|oh pi|opie)"
          - "from jack to (opi|op|o pi|o p i|o o p|oh pi|opie)"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.jack_wi_fi_scan
      - service: switch.turn_on
        target:
          entity_id: switch.opi_wi_fi_scan
      - set_conversation_response: "Stopping jack and handing Wi-Fi scanning over to opi."

  # ---- handoff: opi -> jack --------------------------------------------------
  - id: rj_scan_handoff_to_jack
    alias: "RJ scan — hand back to jack (voice)"
    mode: single
    trigger:
      - platform: conversation
        command:
          - "hand [off] scanning back to jack"
          - "give scanning back to jack"
          - "switch scanning back to jack"
          - "let jack take over scanning"
          # "from opi to jack" phrasings (+ Whisper opi mis-spellings)
          - "switch [the] [(wifi|wi-fi|wi fi)] [scanning] from (opi|op|o pi|o p i|o o p|oh pi|opie) to jack"
          - "(move|hand|give|send) [the] [scanning] from (opi|op|o pi|o p i|o o p|oh pi|opie) to jack"
          - "from (opi|op|o pi|o p i|o o p|oh pi|opie) to jack"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.opi_wi_fi_scan
      - service: switch.turn_on
        target:
          entity_id: switch.jack_wi_fi_scan
      - set_conversation_response: "Handing Wi-Fi scanning back to jack."

  # ---- status query ----------------------------------------------------------
  - id: rj_scan_status_query
    alias: "RJ scan — status (voice)"
    mode: single
    trigger:
      - platform: conversation
        command:
          - "(is|are) [we] scanning"
          - "who is scanning"
          - "scanning status"
          - "what is the scanning status"
          - "is jack scanning"
    action:
      - set_conversation_response: >-
          {% set jack = states('switch.jack_wi_fi_scan') %}
          {% set opi = states('switch.opi_wi_fi_scan') %}
          {% if jack == 'on' %}Jack is scanning.
          {% elif opi == 'on' %}Opi is scanning; jack is idle.
          {% elif jack == 'unavailable' and opi == 'unavailable' %}No scanner is reachable.
          {% else %}Scanning is off on both jack and opi.{% endif %}

  # ---- Atom heartbeat: cyan when EITHER node scans -----------------------------
  # The Pyramid firmware reads binary_sensor.raspyjack_monitor_mode (topic
  # homeassistant/raspyjack/monitor) — historically jack-only. Reflect the
  # combined scan-switch state so the heartbeat turns cyan whether jack OR opi
  # is the active scanner (was staying red when scanning moved to opi).
  - id: rj_scan_reflect_monitor_led
    alias: "RJ scan — reflect combined scan state to Atom heartbeat"
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - switch.jack_wi_fi_scan
          - switch.opi_wi_fi_scan
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "homeassistant/raspyjack/monitor"
          retain: true
          qos: 1
          payload: >-
            {% if is_state('switch.jack_wi_fi_scan','on') or is_state('switch.opi_wi_fi_scan','on') %}ON{% else %}OFF{% endif %}
